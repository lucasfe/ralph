name: Release

# End-to-end automation for @lucasfe/ralph releases.
#
# Flow on every push to main:
#   1. release-please inspects commits since the last release tag. If it
#      finds user-facing CC types (`feat:` / `fix:`), it opens (or updates)
#      a Release PR that bumps `package.json` and prepends a CHANGELOG entry.
#   2. A maintainer reviews and merges the Release PR. The merge triggers
#      another `push: main` event → this workflow runs again.
#   3. Two SIBLING jobs run next, both waiting on `release-please` and on
#      nothing else. Each is always-run and idempotent, so a push where
#      release-please created nothing still evaluates them and they
#      short-circuit:
#        - publish: reads `package.json`, asks npm if that exact version is
#          already published, and publishes only if it isn't. If the Release PR
#          merged and the new version isn't on npm yet, this job fills the gap.
#          If the version is already there, it's a no-op.
#        - homebrew (#202): renders Formula/ralph.rb for that version, proves it
#          installs on a macOS runner, and pushes it to lucasfe/homebrew-ralph.
#          Its INDEPENDENCE from `publish` is the entire point of it; the job
#          argues why at length, and that argument is load-bearing.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish @lucasfe/ralph to npm (match-publish safety net)
    needs: release-please
    # Run even when no Release PR was created — a previous run may have
    # already merged a Release PR and bumped package.json; this run sees the
    # new version and publishes. Idempotent: skips if already published.
    if: always() && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 ships with npm >= 11, required for trusted publishing (OIDC).
          node-version: '24'
          # NO `registry-url:`, AND IT IS NOT THE FIX — THAT THEORY WAS TESTED
          # AND FAILED, which is worth more here than a tidy explanation.
          #
          # The theory: given `registry-url`, setup-node writes an .npmrc at
          # NPM_CONFIG_USERCONFIG whose auth line is
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and this
          # workflow has no token to fill it with — trusted publishing is the
          # point — so setup-node substitutes a placeholder and the job exports
          # the literal `NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX`. All of that is
          # true and measurable in the job log. The inference drawn from it — that
          # npm was sending the placeholder as a bearer token and skipping the
          # OIDC exchange — was wrong. Dropping the key made `userconfig` unset
          # and left no credential configured, and the publish returned the same
          # `403 Forbidden - PUT https://registry.npmjs.org/@lucasfe%2fralph`.
          #
          # The key stays off regardless, because it is unnecessary under trusted
          # publishing (registry.npmjs.org is npm's default, so publish reaches
          # the same place) and because a placeholder credential in the
          # environment is one more thing to rule out next time. See the publish
          # step for where the investigation actually stands.
          #
          # One trap documented so nobody re-enters it: provenance SUCCEEDS on
          # the line immediately before the 403. Signing is client-side against
          # sigstore using the GitHub OIDC token and needs no npm auth, so a
          # signed provenance statement proves `id-token: write` works and says
          # nothing whatever about being authorised to publish.
          cache: 'npm'

      - name: Check whether current package.json version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@lucasfe/ralph@$VERSION" version 2>/dev/null | grep -q "^$VERSION$"; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already on npm — nothing to do."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION not on npm — will publish."
          fi

      - name: Install dependencies
        if: steps.check.outputs.already_published == 'false'
        run: npm ci

      - name: Run tests
        if: steps.check.outputs.already_published == 'false'
        run: npm test

      - name: Publish to npm via OIDC (Trusted Publisher)
        if: steps.check.outputs.already_published == 'false'
        run: |
          # WHY THIS STEP IS INSTRUMENTED. Publishing failed for four days on a
          # bare
          #     npm error code E403
          #     npm error 403 403 Forbidden - PUT https://registry.npmjs.org/@lucasfe%2fralph
          #     npm error 403 In most cases, you or one of your dependencies are
          #     requesting a package version that is forbidden by your security policy
          # That last sentence is npm's FALLBACK text, printed whenever the
          # registry's response carries no error field npm can surface. It names
          # neither the cause nor even the right layer, and it cost three wrong
          # theories. The instrumentation stays so the next one is cheap.
          #
          # RULED OUT BY MEASUREMENT, recorded so none of it is re-investigated:
          # the Trusted Publisher config matches (lucasfe/ralph, release.yml, no
          # environment, BOTH allowed actions ticked); no credential is
          # configured, and an earlier theory that setup-node's `registry-url`
          # was injecting a placeholder token was WRONG — removing it changed
          # nothing; the version was genuinely absent from the registry, so this
          # was never a publish-over-existing; and `id-token: write` works.
          #
          # AND IT IS NOT THE EXCHANGE EITHER. Verbose logging settled that:
          #     http fetch POST 201 .../-/npm/v1/oidc/token/exchange/package/@lucasfe%2fralph
          #     verbose oidc Successfully retrieved and set token
          #     http fetch PUT  403 https://registry.npmjs.org/@lucasfe%2fralph   33ms
          # npm authenticates fine and is handed a real publish token. The write
          # is then refused in 33ms, which is a policy decision, not an auth one.
          #
          # NOR IS IT `--access public`, WHICH WAS THE THIRD WRONG THEORY. The
          # reasoning was good and the conclusion was false, so both are kept:
          # the notice npm prints two lines above the 403 reads
          #     npm notice npm tokens that bypass 2FA are being restricted for
          #     account changes and direct publishing.
          #     https://gh.io/npm-gat-bypass2fa-deprecation
          # and that deprecation IS already in force for management actions, with
          # "changing package access, maintainers, or trusted publishing
          # configuration" on the blocked list. `--access public` is a package
          # access change, so it looked like the publish was smuggling a
          # restricted action into the upload. Removing it (and
          # `publishConfig.access`, since npm sends the field if either is set)
          # changed the log to `Publishing ... with tag latest and default
          # access` and left the 403 intact at 38ms.
          #
          # The flags stay off regardless: the package has been public since
          # 0.1.0 and access is sticky registry-side, so setting it every release
          # was asking for a restricted action for no benefit.
          #
          # WHAT THE 403 STILL IS, stated as the open question rather than a
          # fourth guess. The request is now maximally plain — valid OIDC token,
          # default access, `latest` tag, provenance — and the registry refuses
          # it in under 40ms after answering GET on both the package document and
          # its visibility endpoint. The remaining suspect is the OTHER half of
          # that same deprecation: direct publishing by anything npm classifies
          # as a 2FA-bypass credential. The changelog targets January 2027 for
          # it, but this package's Publishing access is set to "require 2FA OR a
          # granular access token with bypass 2fa enabled" — the mode that admits
          # such tokens — and enforcement waves have already outrun the published
          # timeline once here, which is exactly how 2026-08-28 worked and
          # 2026-09-01 did not on a byte-identical workflow. Same runner image,
          # Node 24.19.0, npm 11.17.0, same permission blocks in both runs.
          #
          # NEXT MOVES, both requiring a decision on npmjs.com rather than here:
          # switch Publishing access to "require 2FA and disallow bypass 2fa
          # tokens" (npm documents trusted publishers as continuing to work
          # regardless, so this should cost nothing and removes the bypass-token
          # classification), or adopt staged publishing — `npm stage publish`
          # here plus a maintainer approving each release with 2FA.
          echo "userconfig:  ${NPM_CONFIG_USERCONFIG:-<unset>}"
          echo "registry:    $(npm config get registry)"
          echo "npm:         $(npm --version)"
          echo "workflow ref: ${GITHUB_WORKFLOW_REF:-<unset>}"

          VERSION='${{ steps.check.outputs.version }}'
          # No `--access`: see above. Provenance is actually automatic for an OIDC
          # publish of a public package from a public repo, so this flag is belt
          # and braces rather than load-bearing — kept because it makes the
          # attestation explicit at the call site, and because it demonstrably is
          # not what the registry objects to: it signed successfully on every one
          # of the failing runs.
          ARGS=(--provenance)
          # Prereleases (0.16.0-rc.1, …) go to the `rc` dist-tag so `latest`
          # keeps pointing at the most recent stable.
          [[ "$VERSION" == *-* ]] && ARGS+=(--tag rc)

          # `--loglevel verbose` is what surfaces the `npm http fetch` line for
          # the exchange request and its status. Kept unconditionally rather than
          # behind a debug flag: this failure only ever reproduces during a real
          # release, which is the worst moment to discover the log is too quiet.
          # `if !` rather than `cmd && exit 0` so the step does not lean on how
          # errexit treats a failing non-final element of an AND-OR list. An `if`
          # condition is unambiguously exempt; the AND-OR form happens to behave
          # the same way in bash, which is exactly the kind of subtlety that
          # should not be load-bearing in the job that publishes.
          if ! npm publish "${ARGS[@]}" --loglevel verbose; then
            # Surface the registry's side of the conversation. GREPPED rather
            # than dumped: the debug log is silly-level and can carry request
            # detail, so only the lines about the exchange and the refusal are
            # echoed, never the whole file.
            #
            # `2fa|bypass|deprecat|notice` IS IN THE PATTERN BECAUSE ITS ABSENCE
            # HID THE ANSWER. The first version matched only
            # `oidc|exchange|trusted|403|PUT https|Forbidden`, and the line that
            # actually explained the failure — npm's notice about 2FA-bypass
            # tokens being restricted for account changes — contains none of
            # those words, so this group printed three useless lines while the
            # cause sat two lines above the error in the raw log.
            echo '::group::npm debug log — OIDC exchange, notices and 403 detail'
            grep -hiE 'oidc|exchange|trusted|403|PUT https|Forbidden|2fa|bypass|deprecat|notice' \
              "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | tail -60 || true
            echo '::endgroup::'
            exit 1
          fi

  homebrew:
    name: Publish Formula/ralph.rb to the Homebrew tap
    # A SIBLING OF `publish`, NOT A DEPENDENT, AND THAT IS THE WHOLE FEATURE.
    # Do not "tidy" this into `needs: [release-please, publish]`. It reads like an
    # oversight — surely the formula goes out after the package? — and the ordering
    # it would impose is exactly the failure this channel exists to survive. npm has
    # refused this package's publish since 0.23.0 (#196; the step above documents
    # four ruled-out theories and the open question), and six tagged releases are
    # sitting unpublished because of it. Chain this job behind that one and the
    # second channel inherits the first one's outage: `publish` fails, GitHub skips
    # `homebrew`, and a release that Homebrew could have delivered reaches nobody.
    #
    # Homebrew does not need npm to have succeeded. It builds from the source tarball
    # GitHub serves for the RELEASE TAG, and release-please creates that tag when the
    # Release PR merges — before either job starts. So the two channels are genuinely
    # independent and the graph says so.
    needs: release-please
    # THE WORKFLOW RUN STILL GOES RED WHEN npm FAILS, ON PURPOSE. There is no
    # `continue-on-error` anywhere in this file and there must not be. Marking the
    # npm job soft would turn the red run green and retire the pressure to fix the
    # 403 — and worse, it would make a FUTURE, DIFFERENT npm failure look exactly
    # like today's known one. A red run beside a shipped formula is the honest
    # report: users got the release, maintainers still owe npm an answer.
    #
    # The `if` below is the npm job's guard character for character, for the same
    # reason: a push where release-please created nothing must still evaluate this
    # job so the version check can short-circuit it.
    if: always() && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    # macos-latest because `brew` is only here, and the pre-flight below has to
    # install the formula on the platform a user would. Free on a public repo.
    runs-on: macos-latest
    permissions:
      # `contents: read` is for `actions/checkout` of THIS repository and nothing
      # else. The tap is read anonymously (it is public, and the probe is a clone,
      # not an API call) and written with a PAT, because GITHUB_TOKEN cannot write
      # to another repository whatever scopes it is given. And NO `id-token: write`:
      # nothing in this job speaks OIDC, so granting it would be an unused signing
      # capability on the one job that runs a build over bytes fetched from the net.
      contents: read
    env:
      TAP_REPO: lucasfe/homebrew-ralph
      # A throwaway tap that exists only inside this runner. `brew audit [path ...]`
      # is DISABLED — measured on Homebrew 6.0.21-34-ga8820d0:
      # "Error: Calling `brew audit [path ...]` is disabled! Use `brew audit
      # [name ...]` instead." — so every pre-flight command has to address the
      # formula by name, and a name needs a tap to live in.
      PREFLIGHT_TAP: ralphci/preflight
      # THE SECRET GATE, AND WHY THIS JOB WAS MERGEABLE BEFORE THE TAP EXISTED.
      # HOMEBREW_TAP_TOKEN is a fine-grained PAT scoped to contents:write on the tap
      # repository alone. It did not exist when this job was written — creating it was
      # #203 — so the push step is conditioned on this boolean and skipped until it
      # did. It EXISTS NOW: the tap's first commit is `ralph 0.26.0`, authored by
      # github-actions[bot] on 2026-09-13, which is this job's push step (measured with
      # `gh api repos/lucasfe/homebrew-ralph/commits`). So the boolean reads "true" on
      # main today and the gate's remaining job is a fork or a clone without the
      # secret, where these steps must skip rather than fail.
      #
      # It is evaluated HERE rather than in the step's own `if` because `secrets` is
      # not one of the contexts a step-level `if` can read; the expression would
      # resolve to the empty string and the step would be skipped forever, including
      # after the secret landed. A job-level `env` CAN read `secrets`, so the
      # presence of the secret is turned into the string "true" or "false" once, and
      # the step reads that. Both consequences are wanted: green on main today, and
      # self-enabling the moment the secret appears, with no follow-up PR.
      TAP_PUSH_ENABLED: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # NO `actions/setup-node` HERE, unlike the npm job. Two reasons. The generator
      # is dependency-free (`scripts/generate-homebrew-formula.js` imports only
      # `node:` builtins), so the runner's own Node runs it as well as a pinned one
      # would. And `brew install` below compiles the formula, which runs `npm
      # install` against the `node` Homebrew resolves as a dependency; adding a
      # second Node to PATH ahead of it is a way for this job to build against an
      # interpreter no user will have. That second reason is a deliberate
      # conservatism rather than a measurement — Homebrew's build environment is
      # sanitised and may well filter it out — and the cost of being careful is
      # nothing, because nothing here needs a specific Node.
      - name: Ask the tap whether it already carries this version
        id: tap
        run: |
          # IDEMPOTENCE, mirroring the npm job's `npm view` pre-check: a re-run, or
          # an unrelated push to main, must not re-push or double-bump. Everything
          # after this step is gated on the answer.
          #
          # The probe CLONES the tap rather than asking the API, because the empty
          # tap is a reachable state and every API-shaped probe reports it as a
          # failure. Measured against the real lucasfe/homebrew-ralph WHILE IT STILL
          # HAD NO COMMITS — it carries one now, `ralph 0.26.0`, pushed by the step at
          # the end of this job on 2026-09-13, so the measurement below is history and
          # not a state to go looking for: `git clone --depth 1` exits 0 and warns "You
          # appear to have cloned an empty repository", while `gh api .../contents/...`
          # exits 1 with `{"message":"This repository is empty."}` and
          # `gh api .../commits` answers HTTP 409. A clone can tell an empty tap from a
          # missing one at the exit status; a swallowed 404 cannot. The reasoning
          # outlives the empty tap, because a tap recreated, renamed or force-reset is
          # the same state again. The clone is also the checkout the push step needs,
          # so it costs nothing extra.
          #
          # scripts/homebrew-tap-plan.js owns that logic — as a script and not a
          # heredoc, so the empty-tap case is driven for real in
          # test/homebrew-release-job.test.js instead of being a claim nobody can
          # check until a release day. It prints `version=`, `tarball_url=` and
          # `carries_version=` on stdout for $GITHUB_OUTPUT, and its reasoning on
          # stderr, which is what puts the skip decision in this log.
          TAP_DIR="$RUNNER_TEMP/homebrew-ralph"
          echo "TAP_DIR=$TAP_DIR" >> "$GITHUB_ENV"
          node scripts/homebrew-tap-plan.js \
            --remote "https://github.com/$TAP_REPO" \
            --into "$TAP_DIR" >> "$GITHUB_OUTPUT"

      - name: Fetch the tag tarball and hash the bytes it served
        id: tarball
        if: steps.tap.outputs.carries_version == 'false'
        env:
          # The URL comes from the probe, which builds it with `tagTarballUrl` in
          # scripts/lib/render-homebrew-formula.js — the same function the formula's
          # own `url` line is rendered from. So the bytes hashed below are, by
          # construction, the bytes a user's `brew install` will fetch. Spelling the
          # endpoint here instead would be a second copy that could drift, and drift
          # means a checksum mismatch discovered on somebody else's machine.
          TARBALL_URL: ${{ steps.tap.outputs.tarball_url }}
        run: |
          # Hashed from what the URL actually served, never from an archive produced
          # locally out of this checkout. That distinction is MEASURED, not assumed:
          # for v0.25.4, `curl -sL <the URL above> | shasum -a 256` gives
          # 010d0b38…a94cc, while `git archive --format=tar.gz
          # --prefix=ralph-0.25.4/ v0.25.4 | shasum -a 256` — the same tree, the same
          # prefix — gives d63484d9…4557. Two different digests for the same release,
          # and only one of them is the file `brew install` downloads.
          TARBALL="$RUNNER_TEMP/ralph-source.tar.gz"
          curl --fail --silent --show-error --location --output "$TARBALL" "$TARBALL_URL"
          DIGEST=$(shasum -a 256 "$TARBALL" | cut -d ' ' -f 1)
          echo "sha256=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$TARBALL_URL"
          echo "  sha256  $DIGEST"

      - name: Render Formula/ralph.rb from that version and that digest
        if: steps.tap.outputs.carries_version == 'false'
        env:
          VERSION: ${{ steps.tap.outputs.version }}
          SHA256: ${{ steps.tarball.outputs.sha256 }}
        run: |
          # Straight into the tap clone, so the pre-flight below inspects the exact
          # file the push would publish rather than a copy of it. `--version` is
          # passed explicitly even though the generator defaults to package.json's,
          # so the version hashed and the version rendered are one value.
          mkdir -p "$TAP_DIR/Formula"
          node scripts/generate-homebrew-formula.js \
            --version "$VERSION" --sha256 "$SHA256" --out "$TAP_DIR/Formula/ralph.rb"
          echo '::group::Formula/ralph.rb'
          cat "$TAP_DIR/Formula/ralph.rb"
          echo '::endgroup::'

      # PRE-FLIGHT — THREE STEPS, ALL BEFORE THE PUSH. If this channel can ship a
      # formula that does not install, it is not a fallback; it is a second way to
      # fail. So the formula is installed, exercised and audited on a real macOS
      # runner first, and any of the three failing takes the job down before the
      # push step is reached. They are separate steps so the run log names which
      # property broke.
      - name: Pre-flight — brew install --build-from-source
        if: steps.tap.outputs.carries_version == 'false'
        run: |
          # By name out of a throwaway tap, because addressing a formula by path is
          # disabled (see PREFLIGHT_TAP above). `--no-git` keeps it a plain directory
          # — nothing here commits or pushes to it. Measured locally on Homebrew
          # 6.0.21-34-ga8820d0 with the formula rendered for 0.25.4: `brew tap-new
          # --no-git`, the copy, and `brew install --dry-run --build-from-source
          # ralphci/preflight/ralph` all succeed, and the dry run resolves `node` as
          # the dependency the formula declares. That the real build then succeeds on
          # a runner is what this step is here to find out rather than something
          # asserted here.
          #
          # `--build-from-source` because there is no bottle and never will be: the
          # formula compiles the tag's source tree with npm.
          brew tap-new --no-git "$PREFLIGHT_TAP"
          cp "$TAP_DIR/Formula/ralph.rb" "$(brew --repository "$PREFLIGHT_TAP")/Formula/ralph.rb"
          brew install --build-from-source "$PREFLIGHT_TAP/ralph"

      - name: Pre-flight — brew test
        if: steps.tap.outputs.carries_version == 'false'
        # Runs the formula's own `test do` block, which is
        # `assert_match "<version>", shell_output("#{bin}/ralph --version")`. That
        # asserts the two things an install can get wrong and still look fine: the
        # linked executable runs, and the version it reports is the version the tap
        # says it published.
        run: brew test "$PREFLIGHT_TAP/ralph"

      - name: Pre-flight — brew audit --strict
        if: steps.tap.outputs.carries_version == 'false'
        # Last of the three because it is the cheapest and the least conclusive: it
        # checks the formula's shape, not that it works. Measured locally on Homebrew
        # 6.0.21-34-ga8820d0 against the formula rendered for 0.25.4 — exit 0, no
        # output at all, and `brew style` reports "1 file inspected, no offenses
        # detected". CONTRIBUTING records the two edits that break it (reordering the
        # fields, and qualifying `std_npm_args`); this step is what would catch a
        # third.
        run: brew audit --strict "$PREFLIGHT_TAP/ralph"

      - name: Push Formula/ralph.rb to the tap
        # Both gates, and neither is optional. `carries_version` keeps a re-run from
        # pushing twice; TAP_PUSH_ENABLED kept this job green while the secret #203
        # created did not exist, and now that it does (see the env block) it keeps a
        # fork or a secretless clone skipping here instead of failing. Note it reads
        # `env.`, not `secrets.` — see the env block for why a secret cannot be tested
        # here directly.
        if: steps.tap.outputs.carries_version == 'false' && env.TAP_PUSH_ENABLED == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.tap.outputs.version }}
        run: |
          cd "$TAP_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/ralph.rb
          git commit -m "ralph $VERSION"
          # `HEAD:refs/heads/main` rather than `git push origin main`, because the
          # first release pushed into an EMPTY repository — that release was 0.26.0 on
          # 2026-09-13 and this form is what carried it: a clone of one leaves HEAD
          # as an unborn symref (measured — `git symbolic-ref --short HEAD` answers
          # `main` in a clone of the then-empty lucasfe/homebrew-ralph, with `git
          # status` reporting "No commits yet on main"), and the branch only starts
          # existing with this commit. The explicit refspec covers that case and the
          # ordinary one identically. Measured end to end against a local
          # `git init --bare --initial-branch=main` remote with these exact commands:
          # the first push answers `* [new branch] HEAD -> main`, and re-running the
          # probe against that remote then reports `carries_version=true`, which is
          # the idempotence this job leans on.
          #
          # The token goes in the URL because the clone above was anonymous and there
          # is no credential configured for this remote; Actions masks the secret's
          # value in the log.
          git push "https://x-access-token:$TAP_TOKEN@github.com/$TAP_REPO" HEAD:refs/heads/main

      # SMOKE TEST — THE ONLY STEP THAT WALKS THE PATH A USER WALKS, AND THE ONLY ONE
      # THAT CANNOT RUN BEFORE THE PUSH (#216). The three pre-flight steps above all
      # passed on the formula the 0.26.0 release pushed, and that formula could not be
      # tapped at all. That blindness is STRUCTURAL, not bad luck, and the two reasons
      # are both readable in brew's own source — `git show <tag>:Library/Homebrew/...`
      # in `$(brew --repository)`, checked at 6.0.21 and 7.0.0, read and not executed:
      #   1. `brew install` TRUSTS A FULLY-QUALIFIED NAME WHILE INSTALLING IT.
      #      `cmd/install.rb:197` calls `Trust.trust_fully_qualified_items!(args.named)`,
      #      which writes a trust entry for every `<user>/<tap>/<formula>` argument out
      #      of a non-official tap (trust.rb:125) — and a fully-qualified name is exactly
      #      what the pre-flight installs. The 0.26.0 run's log carries the receipt:
      #      `==> Trusted formula ralphci/preflight/ralph` (run 34761250463).
      #   2. THE PRE-FLIGHT NEVER TAPS A REMOTE. `brew tap-new --no-git` builds the tap
      #      on the runner, and the refusal fires in `brew tap` against a tap fetched
      #      from a stranger. A check that never runs the command cannot see what the
      #      command rejects.
      # NOT because a local tap is trusted implicitly — that was this file's earlier
      # explanation and it is wrong. `Tap#implicitly_trusted?` is `official? &&
      # canonical_remote?` (tap.rb:1491) and `official?` is `user == "Homebrew"`
      # (tap.rb:475), so `ralphci/preflight` is not implicitly trusted by anything; it is
      # the install-time auto-trust above that lets it through. Reason 1 is also why
      # criterion 1 of #216 asks for the BARE name below: `brew install
      # "$TAP_NAME/ralph"` would auto-trust the very tap it is supposed to be testing and
      # hide the failure this step exists to catch. This step REPLACES NOTHING: keep all
      # three pre-flight steps, because they are the only checks that can still stop a
      # bad formula from reaching the tap.
      #
      # IT RUNS AFTER THE BYTES ARE ALREADY PUBLIC, and no rearrangement can change
      # that — the real install path does not exist until the formula is on the tap. So
      # read a failure here for what it is: not "the release was stopped" but "the
      # release shipped and nobody can install it". It still FAILS THE JOB, on purpose
      # and with no `continue-on-error` here or anywhere in this file, which does mean a
      # red run on a release that really did go out. That is the honest report — a tap
      # nobody can install from is a broken channel however complete the push was — and
      # the alternative is a green run asserting the release landed, which would be
      # false. Whoever sees this red should fix the tap or the formula, not the step.
      #
      # AND IT IS NOT A HYPOTHETICAL STEP: the tap's first commit is `ralph 0.26.0`,
      # authored by github-actions[bot] on 2026-09-13 — the push step above, on the
      # release whose formula could not then be tapped. Both of this step's gates are
      # satisfiable on main today, so it runs on the next release rather than waiting
      # for a secret.
      #
      # THE GATE IS NOT A HOMEBREW 7 NOVELTY, which is what this file used to say. At tag
      # 6.0.21 `env_config.rb:666` declares HOMEBREW_REQUIRE_TAP_TRUST with `default:
      # true` and `disabled_by: :HOMEBREW_NO_REQUIRE_TAP_TRUST`, and the boolean predicate
      # generated for it returns true when the default is true and the variable is blank
      # (env_config.rb:896-907) — so `require_trusted_formula!` reaches `raise_untrusted!`
      # there exactly as it does on 7.0.0 (trust.rb:224-234). #216 reports the runner on
      # 6.0.21, so this step should meet the same refusal the by-hand session met, and the
      # `brew trust` below is load-bearing rather than future-proofing.
      #
      # TWO THINGS A GREEN RUN STILL WOULD NOT SETTLE, neither of them measurable from
      # this workspace and neither a reason to move the step. Whether the runner image
      # exports HOMEBREW_NO_REQUIRE_TAP_TRUST: that switches the gate off, and it is the
      # one way a green run here could mean less than it looks — the 0.26.0 log prints no
      # `HOMEBREW_*` variable at all, so nothing in this repository answers it. And the
      # runner's brew version itself: #216 reports 6.0.21, and no log in this repository
      # prints one. Both are why the step opens by dumping `brew --version` and the
      # image's `HOMEBREW_*` environment — the next run answers what this comment cannot.
      # What a user has to type is a question for the README, not for this job.
      - name: Smoke test — tap the remote, trust it, install by bare name
        # The push step's gate character for character, and it has to be: this step
        # asks whether the tap serves what was pushed, which is not a question on
        # either skip path. On `carries_version == 'true'` this run pushed nothing, and
        # on a missing secret nothing was pushed at all — there the step would be
        # testing whatever the tap already held, or an empty tap, and calling the answer
        # a verdict on this run.
        if: steps.tap.outputs.carries_version == 'false' && env.TAP_PUSH_ENABLED == 'true'
        env:
          VERSION: ${{ steps.tap.outputs.version }}
        run: |
          # WHAT THE RUNNER'S HOMEBREW ACTUALLY IS, printed before anything depends on
          # it. Every claim in this step about the runner's brew — that it has `trust`,
          # that it enforces the gate — rests on a version this repository has never
          # logged: #216 reports 6.0.21 and no run of this job has ever printed one. The
          # `HOMEBREW_*` dump is the other half, because HOMEBREW_NO_REQUIRE_TAP_TRUST in
          # the image would turn the gate off and make a pass here mean less than it
          # looks. `|| true` is INSURANCE and not a fix for a live failure: `grep` does
          # exit 1 on no match, but `sort` is last in the pipeline and nothing here sets
          # `pipefail`, so the pipeline's status is already 0 and `-e` never sees grep's
          # (measured: `bash -ec "env | grep '^ZZZ' | sort; echo status=$?"` prints
          # `status=0` and exits 0). It is here so that dropping `| sort` in a later edit
          # cannot turn "the image sets none of them" — a fact worth seeing — into a
          # failed step on a release that shipped.
          brew --version
          env | grep '^HOMEBREW_' | sort || true

          # `lucasfe/ralph`, derived rather than spelled a second time: a tap named
          # `<user>/<name>` lives at `github.com/<user>/homebrew-<name>`, so the tap
          # name is TAP_REPO with the `homebrew-` prefix taken out. One identity, one
          # place it is written down. The replacement is first-match and unanchored, so
          # it is right for every TAP_REPO whose OWNER does not itself start `homebrew-`.
          # The anchored spelling CAN be written in this form — `${TAP_REPO/\/homebrew-//}`
          # gives `lucasfe/ralph` for this repository and `homebrew-mac/ralph` for that
          # pathological owner, measured in bash — and is not used for a reason that is
          # about the SPEC rather than the shell: the spec below models this expansion by
          # parsing the pattern and the replacement out of the braces, and a pattern
          # holding a `/` splits in the wrong place, so the anchored form reddens its
          # equality assertion even for the real TAP_REPO. What holds the case instead is
          # that same spec applying this expansion to the TAP_REPO in the env above and
          # comparing the answer with the anchored rule, so a TAP_REPO that would break
          # it goes red in the suite rather than on a release day.
          TAP_NAME="${TAP_REPO/homebrew-/}"

          # AN EMPTY VERSION WOULD DELETE THE ONLY ASSERTION IN THIS STEP, so it is
          # refused here rather than at the bottom. The verdict below is a substring
          # test, `*"$VERSION"*`, and the empty string is a substring of every string:
          # with VERSION empty that test passes for whatever the tap serves, including
          # the previous release, and the step goes green having checked nothing.
          # `bash -e {0}` is what Actions runs a `run:` block as — no `-u` — so an
          # expansion of a name nobody set is the empty string and not an error, which
          # is why `-e` alone does not catch this. The probe as written cannot produce
          # it (`homebrew-tap-plan.js` emits `version=` in the same write as
          # `carries_version=`), but this step reaches that output through a step id, an
          # output name and an `env:` key, and a rename of any of the three is enough.
          # Failing before the teardown also leaves the runner's Homebrew untouched.
          : "${VERSION:?the tap probe reported no version}"

          # THE PRE-FLIGHT'S KEG AND TAP HAVE TO GO FIRST, or this step proves nothing.
          # `ralph` is installed right now — the first pre-flight step built it — and
          # `ralphci/preflight` is still tapped, at the very version this step is about
          # to assert. Leave them and `brew install ralph` is answered locally (or by an
          # ambiguity between two tapped formulae called `ralph`; which of the two brew
          # would do was NOT measured), and then `ralph --version` prints the right
          # number whatever the remote tap holds. Removing both rules out both. The keg
          # goes before the untap so the name still resolves when it is uninstalled.
          # `brew uninstall` earns its place a second way: the pre-flight's install wrote
          # a trust entry for `ralphci/preflight/ralph` (see the auto-trust above), and
          # uninstalling the keg takes it back out — `cmd/uninstall.rb` collects each
          # keg's `tab.tap` into `trusted_items_to_remove` and calls `Trust.untrust!` on
          # every one whose tap is not itself trusted (uninstall.rb:51-71, 122-127, the
          # same at 6.0.21 and 7.0.0; read in source, not run). So the step does not leave
          # a trust entry of its own making behind to explain a later green.
          brew uninstall ralph
          brew untap "$PREFLIGHT_TAP"

          # TRUST, UNCONDITIONALLY.
          #
          # MEASURED by hand on 2026-09-13, Homebrew 7.0.0, against the tap the 0.26.0
          # release had just pushed to: `brew tap lucasfe/ralph` clones the tap and then
          # refuses it —
          #     Error: Invalid formula (golden_gate): .../Formula/ralph.rb
          #     Refusing to load formula lucasfe/ralph/ralph from untrusted tap
          #     lucasfe/ralph.
          #     Run `brew trust --formula lucasfe/ralph/ralph` or `brew trust
          #     lucasfe/ralph` to trust it.
          # about thirty lines of that, one `Invalid formula` per platform brew
          # enumerates, ending `Error: Cannot tap lucasfe/ralph: invalid syntax in
          # tap!`. `brew install ralph` then answers `No available formula with the name
          # "ralph"` and suggests `ralph-orchestrator`, somebody else's package. Nothing
          # was wrong with the formula: `brew trust lucasfe/ralph` clears it in one line
          # and `brew install ralph` then succeeds. `Invalid formula` naming a platform
          # is what a trust refusal LOOKS like, which is why the surface error accuses
          # the syntax.
          #
          # A `brew commands` PROBE FOR `trust` STOOD HERE AND WAS DELETED. It existed
          # because this file claimed the runner's brew might not have the subcommand and
          # that nothing here could find out. The second half was false: `$(brew
          # --repository)` is a full checkout of Homebrew, so every tagged version is
          # readable from any machine with a brew on it, and the answer is that the runner
          # has `trust`. Read there, not run: `git show
          # 6.0.21:Library/Homebrew/cmd/trust.rb` prints the command with its `switch
          # "--tap", "--taps"`; `git log` dates 5fbcad25e9 "Add tap trust commands" and
          # c6f3723043 "Add tap trust enforcement" to the same day, 2026-05-30; and `git
          # tag --contains` reports the same earliest tag, 5.1.15, for both. THE COMMAND
          # AND THE REFUSAL SHIPPED TOGETHER, so a brew that can refuse this tap can
          # always clear it, and a brew old enough to lack `trust` — pre-5.1.15, older
          # than any Homebrew anyone has recorded against this repository — has no gate to
          # clear. The branch was insurance against a world that cannot occur, which is
          # indirection this repo would rather delete than keep. If such an image ever
          # does turn up, the line below fails with brew's `Unknown command: trust`, in a
          # step whose whole job is to report what a real install path does.
          #
          # `--tap` RATHER THAN `--formula`: the refusal is a property of the TAP being
          # third-party, which is why one formula produced it once per platform, so
          # trusting the tap covers the formula it holds today and anything it grows
          # later, and it is the form that can run BEFORE the tap is fetched. The bare
          # `brew trust lucasfe/ralph` is the spelling actually run by hand above;
          # `--tap` is the documented explicit form of that same intent (`brew help
          # trust` on 7.0.0: "--tap, --taps  Trust the named tap") and is preferred here
          # so the log records which kind of entry was written rather than leaving it to
          # brew's reading of the argument. The flag itself was not run.
          #
          # TRUST BEFORE TAP, the opposite order to the by-hand session, so `brew tap`
          # never has to fail on the way to succeeding — and trusting a tap that is not
          # fetched yet is a config write and nothing more. That last clause used to be an
          # inference from `brew help trust`'s description of the store
          # (`~/.homebrew/trust.json`, or under `$XDG_CONFIG_HOME`); it is now read in
          # source, at both 6.0.21 and 7.0.0: `cmd/trust.rb`'s named-argument loop
          # resolves the name and calls `Trust.trust!`, which appends to `trust.json`
          # under a lock and returns (trust.rb:46-64), and the `Tap.fetch` in that path is
          # a name parser (tap.rb:56), not a clone. No checkout and no network are
          # required, so this line cannot fail for want of the tap.
          brew trust --tap "$TAP_NAME"

          # The real path, in the order a user walks it, and `ralph` BARE is the whole
          # point of the step: it is the name install instructions can tell somebody to
          # type, and the only one that proves the tap reached brew's SEARCH PATH rather
          # than merely its disk. A tap-qualified `"$TAP_NAME/ralph"` would be worse than
          # merely weaker: `brew install` AUTO-TRUSTS a fully-qualified name as it
          # installs it (`cmd/install.rb:197`, the mechanism that hid this failure from
          # the pre-flight), so the qualified spelling would quietly grant the trust this
          # step is here to prove is needed. It also hands brew the tap instead of asking
          # it to find one, so it cannot see the second half of the measured failure
          # above — `No available formula with the name "ralph"`, with a stranger's
          # package suggested in its place.
          # No `--build-from-source`, unlike the pre-flight: the formula carries no
          # bottle, so brew compiles it regardless, and a user types this without a flag.
          brew tap "$TAP_NAME"
          brew install ralph

          # What the tap actually delivered, against what this run pushed. The number
          # comes from the probe's output, so it cannot drift from the formula that was
          # rendered, hashed and pushed; a literal here would be a second copy of the
          # release number able to fail a release that was fine.
          command -v ralph
          INSTALLED="$(ralph --version)"
          echo "ralph --version -> $INSTALLED"
          if [[ "$INSTALLED" != *"$VERSION"* ]]; then
            echo "::error::the tap installed \`$INSTALLED\`, but this run pushed $VERSION"
            exit 1
          fi
